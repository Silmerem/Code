name: Rastreador de precios de vuelos (Travelpayouts)

on:
  schedule:
    # Una vez al dia (UTC). Los datos de Travelpayouts son de cache
    # (2-7 dias), asi que no tiene sentido correrlo mas seguido.
    - cron: "23 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flight-price-tracker
  cancel-in-progress: false

jobs:
  track-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracker/requirements.txt

      - name: Instalar dependencias
        run: pip install -r tracker/requirements.txt

      - name: Consultar precios
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
        run: python3 tracker/flight_price_tracker_travelpayouts.py

      - name: Publicar historico para el dashboard (flight-tracker/)
        run: |
          if [ -f tracker/flight_price_history.csv ]; then
            cp tracker/flight_price_history.csv flight-tracker/flight_price_history.csv
          fi

      - name: Guardar historico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f tracker/flight_price_history.csv ]; then
            git add tracker/flight_price_history.csv flight-tracker/flight_price_history.csv
          fi
          if git diff --staged --quiet; then
            echo "Sin cambios en el historial (o la consulta no encontro ofertas)"
          else
            git commit -m "chore(flights): snapshot de precios $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
